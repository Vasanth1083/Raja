<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rexcut Customer Details</title>
    <link rel="icon" href="Vimag.png" type="image/png">

    <style>
body { 
    font-family: 'Times New Roman', serif; 
    padding: 20px; 
    /* Background color-ah remove pannitu idhai add pannunga */
    background-image: url('Background7.jpg'); 
    background-size: cover; /* Image full screen-la vara */
    background-repeat: no-repeat; /* Image repeat aagama irukka */
    color: #333; 
}        .container { max-width: 1000px; margin: 20px auto; background: #faf6d7; padding: 30px; border-radius: 30px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); text-align: center; position: relative; }

        .home-btn { 
            position: absolute; top: 20px; left: 20px; 
            background: #2c3e50; color: white; padding: 8px 15px; 
            text-decoration: none; border-radius: 8px; font-weight: bold; 
            font-size: 14px; transition: 0.3s; 
        }
        .home-btn:hover { background: #34495e; transform: scale(1.05); }

        .brand-summary { 
            background: white; padding: 15px; border-radius: 15px; margin-bottom: 25px; 
            border: 3px solid #27ae60; display: inline-block; min-width: 320px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .brand-summary h3 { margin: 0; color: #27ae60; font-size: 1.1em; text-transform: uppercase; }
        .brand-summary .total-amt { font-size: 2em; font-weight: bold; color: #2c3e50; margin-top: 5px; }

        h2 { color: Green; margin-bottom: 20px; font-size: 2.2em; }
        .button-group { display: flex; justify-content: flex-end; margin-bottom: 20px; gap: 10px; }
        .btn { padding: 10px 18px; border: none; cursor: pointer; border-radius: 8px; font-weight: 600; transition: 0.3s; font-family: 'Times New Roman'; }
        
        #delSelectedBtn { background-color: #e74c3c; color: white; }
        #delSelectedBtn:disabled { background-color: #bdc3c7; cursor: not-allowed; }
        #undoBtn { background-color: #f39c12; color: white; }

        .input-section { display: flex; gap: 10px; margin-bottom: 25px; align-items: stretch; /* பாக்ஸ்கள் எல்லாம் ஒரே உயரத்தில் இருக்க */
    height: 50px; }
.update-btn {
    background-color: #2980b9;
    color: white;
    width: 120px;
    font-size: 13px;
    font-weight: bold;
    border-radius: 10px;
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
}
        input[type="text"] { flex-grow: 1; padding: 12px; border: 2px solid #ddd; border-radius: 8px; outline: none; font-size: 17px; font-family: 'Times New Roman'; }
        .add-btn { background-color: #2ecc71; color: white; width: 100px; font-size: 16px; }

        ul { list-style: none; padding: 0; }
        li { 
            margin-bottom: 12px; border-radius: 12px; padding: 15px; 
            display: flex; align-items: center; background: #fff; border: 1px solid #ddd; 
            justify-content: space-between; transition: 0.2s;
        }
        li:hover { transform: scale(1.01); box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .left-side { display: flex; align-items: center; flex-grow: 1; }
        input[type="checkbox"] { margin-right: 15px; width: 22px; height: 22px; cursor: pointer; }
        .cust-link { text-decoration: none; color: black; font-weight: bold; font-size: 20px; text-align: left; }
        
        .cust-total { 
            background: #eafaf1; color: #27ae60; padding: 6px 18px; border-radius: 50px; 
            font-weight: bold; font-size: 18px; border: 1.5px solid #27ae60; min-width: 120px; text-align: right;
        }
    </style>
</head>
<body>

<div class="container">
    <a href="index.html" class="home-btn">🏠 Home Hub</a>

    <h2>Rexcut Customer Details</h2>

    <div class="brand-summary">
        <h3>Brand Achieved Value</h3>
        <div class="total-amt" id="brandGrandTotal">€ 0.00</div>
    </div>
    
    <div class="button-group">
        <button id="delSelectedBtn" class="btn" onclick="deleteSelected()" disabled>🗑 Delete Selected</button>
    </div>

    <div class="input-section">

        <input type="text" id="custName" placeholder="Type Customer Name here..." onkeypress="if(event.key==='Enter') addCustomer()">
    <input type="text" id="custRegion" placeholder="Enter Region (e.g. South, North)" style="flex: 0.5; margin-left: 10px;">

        <button class="btn add-btn" onclick="addCustomer()">+ Add</button>
<button class="btn update-btn" id="mainUpdateBtn" onclick="triggerMainUpdate()" style="margin-left: 10px;" disabled>🔄 Update</button>

    </div>

    <ul id="customerList"></ul>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/9.6.10/firebase-app-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/9.6.10/firebase-database-compat.js"></script>
<script>
const firebaseConfig = {
    apiKey: "AIzaSyBC9Ny5zLH2TBQK9r469OXAMeQ6AbiScn8",
    databaseURL: "https://vimag-database-default-rtdb.firebaseio.com",
    projectId: "vimag-database",
    appId: "1:9582238917:web:1f0af85f45123de2e4a4ac"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

    const BRAND = "Rexcut";
const storageKey = BRAND + "_customers";
let isSyncing = false;
let syncTimer = null;
const G_SHEET_URL = "https://script.google.com/macros/s/AKfycbxt9YfMYA8PKNlC0Vb_DIDVRsMWZnCUPMRGsCoQSnLDXWYorh57KU0NRFzrAmsY8ySRXA/exec?apiKey=VIMAG";
  window.onload = function() { 
            displayCustomers(); 
            
            db.ref(`vimag/brands/${BRAND}`).on('value', (snapshot) => { 
                if (isSyncing) return; 
                const brandData = snapshot.val(); 
                let customerNames = []; 
                if (brandData) { 
                    customerNames = Object.keys(brandData); 
                    customerNames.forEach(name => { 
                        const custData = brandData[name]; 
                        localStorage.setItem(BRAND + '_data_' + name, JSON.stringify(Object.values(custData))); 
                    }); 
                } 
                localStorage.setItem(storageKey, JSON.stringify(customerNames)); 
                displayCustomers(); 
                console.log("Details Page: Cloud Sync Success! ⚡"); 
            }); 
        };

        // Encodes characters safely so whitespace will never throw element mapping selector errors
        function getSafeId(name) {
            return btoa(encodeURIComponent(name)).replace(/=/g, "").replace(/\+/g, "").replace(/\//g, "");
        }

        function displayCustomers() { 
            const brandName = typeof BRAND !== 'undefined' ? BRAND : "Rexcut"; 
            const customers = JSON.parse(localStorage.getItem(storageKey) || "[]"); 
            const listContainer = document.getElementById('customerList'); 
            if (!listContainer) return; 
            
            let listHtml = ""; 
            let grandTotal = 0; 
            
            const sortedCustomers = [...customers].sort((a, b) => a.localeCompare(b)); 
            sortedCustomers.forEach((name) => { 
                if (!name || name === "_id_lock" || name === "_identity" || name === "SYSTEM") return; 
                
                const currentStorageKey = brandName + '_data_' + name; 
                const rawData = localStorage.getItem(currentStorageKey); 
                const data = JSON.parse(rawData || "[]"); 
                let custTotal = 0; 
                let currentRegion = "General";
                
                data.forEach(item => { 
                    if (item && item.id === "_id_lock" && item.region) {
                        currentRegion = item.region;
                    }
                    if (item && item.artNo && item.artNo !== "SYSTEM") { 
                        let p = parseFloat(item.price || 0); 
                        let q = parseInt(item.monthQty || 0); 
                        custTotal += (p * q); 
                    } 
                }); 
                
                grandTotal += custTotal; 
                const statusUrl = `${brandName} Customer Status.html?name=${encodeURIComponent(name)}`; 
                const custId = localStorage.getItem(brandName + '_id_' + name) || ""; 
                const htmlId = getSafeId(name);
                
                listHtml += ` 
                <li id="row-${htmlId}"> 
                    <div class="left-side" id="content-${htmlId}" style="width:100%;"> 
                        <input type="checkbox" class="cust-checkbox" data-id="${custId}" data-name="${name}" onchange="checkSelection()"> 
                        <a href="${statusUrl}" class="cust-link" style="font-weight:bold; color:#2c3e50; margin-left: 10px;">${name} <span style="font-size:13px; color:#7f8c8d; font-weight:normal;">(${currentRegion})</span></a> 
                    </div> 
                    <div class="cust-total" style="font-weight:bold; color:#2980b9;"> € ${custTotal.toLocaleString(undefined, {minimumFractionDigits: 2})} </div> 
                </li>`; 
            }); 
            
            listContainer.innerHTML = listHtml || "<li style='padding:20px; color:gray; justify-content:center;'>No Customers Found. Click Sync Cloud... ☁️</li>"; 
            
            const disp = document.getElementById('brandGrandTotal'); 
            if (disp) { 
                disp.innerText = "€ " + grandTotal.toLocaleString(undefined, {minimumFractionDigits: 2}); 
            } 
            checkSelection();
        } 

        function checkSelection() { 
            const checkboxes = document.querySelectorAll('.cust-checkbox:checked'); 
            const delBtn = document.getElementById('delSelectedBtn'); 
            const updateBtn = document.getElementById('mainUpdateBtn'); 
            
            if (delBtn) delBtn.disabled = (checkboxes.length === 0); 
            if (updateBtn) updateBtn.disabled = (checkboxes.length !== 1); 
        } 

        function triggerMainUpdate() { 
            const checkedBox = document.querySelector('.cust-checkbox:checked'); 
            if (!checkedBox) { 
                alert("Orey oru customer-ah mattum select panni update pannunga!"); 
                return; 
            } 
            
            const targetName = checkedBox.getAttribute('data-name'); 
            if (!targetName) { 
                alert("Selected customer name-ah track panna mudiyala!"); 
                return; 
            } 
            
            const storedItems = JSON.parse(localStorage.getItem(BRAND + '_data_' + targetName) || "[]"); 
            const lockRow = storedItems.find(item => item && item.id === "_id_lock"); 
            const currentRegion = lockRow ? lockRow.region : "General"; 
            
            enableRowEdit(targetName, currentRegion); 
        } 

        function enableRowEdit(oldName, oldRegion) {
            const htmlId = getSafeId(oldName);
            const targetContainer = document.getElementById("content-" + htmlId);
            
            if (!targetContainer) {
                console.error("Target slot missing context reference matching mapping index nodes!");
                return;
            }

            targetContainer.innerHTML = `
                <div class="inline-edit-box" style="width:100%;">
                    <input type="text" class="inline-input" id="edit-name-${htmlId}" value="${oldName}" style="flex-grow:1;">
                    <input type="text" class="inline-input" id="edit-region-${htmlId}" value="${oldRegion}" style="width:150px; flex:none;">
                    <button class="action-save-btn" onclick="updateCustomerData('${oldName}')">💾 Save</button>
                    <button class="action-cancel-btn" onclick="displayCustomers()">❌ Cancel</button>
                </div>
            `;
        }

        function addCustomer() { 
            const input = document.getElementById('custName'); 
            const regionInput = document.getElementById('custRegion'); 
            const name = input.value.trim(); 
            const region = regionInput.value.trim(); 
            
            if (!name || !region) return alert("Please enter both Name and Region!"); 
            
            let customers = JSON.parse(localStorage.getItem(storageKey) || "[]"); 
            if (customers.some(c => c.toLowerCase() === name.toLowerCase())) { 
                alert(`⚠️ Customer "${name}" already exists!`); 
                return; 
            } 
            
            customers.push(name); 
            localStorage.setItem(storageKey, JSON.stringify(customers)); 
            
            const fallbackLock = { id: "_id_lock", region: region || "General" };
            localStorage.setItem(BRAND + '_data_' + name, JSON.stringify([fallbackLock]));
            
            displayCustomers(); 
            sendCustomerToCloud(name, region); 
            
            input.value = ""; 
            regionInput.value = ""; 
            input.focus(); 
        } 

        function sendCustomerToCloud(name, region) { 
            isSyncing = true; 
            const customerId = "CUST-" + Date.now(); 
            localStorage.setItem(BRAND + '_id_' + name, customerId); 
            
            const d = new Date(); 
            const fixedDate = `${String(d.getDate()).padStart(2, '0')}/${String(d.getMonth() + 1).padStart(2, '0')}/${d.getFullYear()}`; 
            const regionVal = region.trim() || "General"; 
            
            db.ref(`vimag/brands/${BRAND}/${name}/_id_lock`).set({ 
                id: "_id_lock", 
                artNo: "SYSTEM", 
                customerName: name, 
                region: regionVal, 
                date: fixedDate 
            }); 
            
            const payload = { 
                action: 'save', 
                customerName: name, 
                id: customerId, 
                brand: BRAND, 
                apiKey: "VIMAG", 
                date: fixedDate 
            }; 
            
            db.ref(`vimag/brands/${BRAND}/${name}/${customerId}`).set(payload); 
            
            clearTimeout(syncTimer); 
            syncTimer = setTimeout(() => { isSyncing = false; }, 1000); 
        } 

        function updateCustomerData(oldName) {
            const htmlId = getSafeId(oldName);
            const newName = document.getElementById(`edit-name-${htmlId}`).value.trim();
            const newRegion = document.getElementById(`edit-region-${htmlId}`).value.trim();

            if (!newName || !newRegion) return alert("Fields cannot be empty!");

            isSyncing = true;
            let customers = JSON.parse(localStorage.getItem(storageKey) || "[]");

            if(oldName !== newName) {
                if (customers.some(c => c.toLowerCase() === newName.toLowerCase())) { 
                    alert(`⚠️ Customer "${newName}" already exists!`); 
                    isSyncing = false;
                    return; 
                }
                customers = customers.filter(c => c !== oldName);
                customers.push(newName);
            }

            const oldDataRaw = localStorage.getItem(BRAND + '_data_' + oldName);
            let customerDataArray = JSON.parse(oldDataRaw || "[]");

            let lockRow = customerDataArray.find(item => item && item.id === "_id_lock");
            if(lockRow) {
                lockRow.customerName = newName;
                lockRow.region = newRegion;
            } else {
                lockRow = { id: "_id_lock", artNo: "SYSTEM", customerName: newName, region: newRegion, date: "" };
                customerDataArray.push(lockRow);
            }

            customerDataArray.forEach(item => {
                if(item) item.customerName = newName;
            });

            localStorage.setItem(storageKey, JSON.stringify(customers));
            localStorage.setItem(BRAND + '_data_' + newName, JSON.stringify(customerDataArray));
            
            const savedId = localStorage.getItem(BRAND + '_id_' + oldName) || "CUST-" + Date.now();
            localStorage.setItem(BRAND + '_id_' + newName, savedId);

            if(oldName !== newName) {
                localStorage.removeItem(BRAND + '_data_' + oldName);
                localStorage.removeItem(BRAND + '_id_' + oldName);
                db.ref(`vimag/brands/${BRAND}/${oldName}`).remove();
            }

            db.ref(`vimag/brands/${BRAND}/${newName}`).set(
                customerDataArray.reduce((acc, currentItem) => {
                    if(currentItem && currentItem.id) {
                        acc[currentItem.id] = currentItem;
                    }
                    return acc;
                }, {})
            );

            const sheetTabName = BRAND.replace(/\s+/g, '') + "Customers"; 
            fetch(G_SHEET_URL + `&action=save&sheetName=${sheetTabName}&id=${savedId}&customerName=${encodeURIComponent(newName)}&region=${encodeURIComponent(newRegion)}&apiKey=VIMAG`, { mode: 'no-cors' });

            displayCustomers();

            clearTimeout(syncTimer); 
            syncTimer = setTimeout(() => { isSyncing = false; }, 1000); 
            alert("Customer Updated Successfully! 🚀");
        }

        function deleteSelected() { 
            const checkboxes = document.querySelectorAll('.cust-checkbox:checked'); 
            if (checkboxes.length === 0) return alert("Select anyone!"); 
            
            if (confirm("Delete panna Firebase & Sheet backup-layum azhinjidum. OK-va?")) { 
                isSyncing = true; 
                let customers = JSON.parse(localStorage.getItem(storageKey) || "[]"); 
                const currentUndoHistory = JSON.parse(localStorage.getItem(BRAND + '_FULL_UNDO') || "[]"); 
                const batchToSave = []; 
                
                checkboxes.forEach(cb => { 
                    const name = cb.getAttribute('data-name'); 
                    const savedId = localStorage.getItem(BRAND + '_id_' + name); 
                    const data = localStorage.getItem(BRAND + '_data_' + name); 
                    
                    batchToSave.push({ name: name, data: data, id: savedId }); 
                    
                    db.ref(`vimag/brands/${BRAND}/${name}`).remove().then(() => console.log(`Firebase: ${name} Deleted! ✅`)); 
                    
                    const sheetTabName = BRAND.replace(/\s+/g, '') + "Customers"; 
                    fetch(G_SHEET_URL + `&action=delete&sheetName=${sheetTabName}&id=${savedId}&apiKey=VIMAG`, { mode: 'no-cors' }); 
                    
                    localStorage.removeItem(BRAND + '_data_' + name); 
                    localStorage.removeItem(BRAND + '_id_' + name); 
                    customers = customers.filter(c => c !== name); 
                }); 
                
                localStorage.setItem(BRAND + '_FULL_UNDO', JSON.stringify(currentUndoHistory.concat([batchToSave]))); 
                localStorage.setItem(storageKey, JSON.stringify(customers)); 
                displayCustomers(); 
                
                clearTimeout(syncTimer); 
                syncTimer = setTimeout(() => { isSyncing = false; }, 1000); 
                alert("Deleted Successfully! ✅"); 
            } 
        } 
    </script> 
</body>
</html>
