<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Territory Report</title>
    <link rel="icon" href="Vimag.png" type="image/png">

    <style>
 body { 
            font-family: 'Times New Roman', serif; 
            background: url('Background10.jpg') no-repeat center center fixed; 
            background-size: cover; 
            margin: 0; padding: 20px;
        }
.header-box {
    width: 80% !important; /* Neenga ketta 90% width */
    margin: 20px auto;
    border: 3px solid #27ae60; /* Green Border */
    background: #fafaf7;
    padding: 25px;
    border-radius: 40px;
    text-align: center;
    position: relative;
    box-shadow: 0 10px 25px rgba(0,0,0,0.1);
    margin-top: 0 !important; /* மேலேயுள்ள கேப்பை முழுமையாக நீக்க */
    margin-bottom: 1px !important; /* டேபிளுக்கும் இதற்கும் இடையே உள்ள கேப்பைக் குறைக்க */

}

.back-link { 
    position: absolute; 
    top: 20px; 
    left: 20px; 
    text-decoration: none; 
    color: #27ae60; 
    font-weight: bold; 
    font-size: 15px; 
}

.btn-print { 
    position: absolute; 
    top: 20px; 
    right: 20px; 
    background: black; 
    color: white; 
    border: none; 
    padding: 8px 15px; 
    border-radius: 8px; 
    cursor: pointer; 
    font-weight: bold; 
}

        h2 { color: #2c3e50; margin: 0; }

table {
    width: 80% !important; /* Neenga ketta 90% width */
    margin: 20px auto;
    border-collapse: separate;
    border-spacing: 0;
    /* 🥂 Perfect Glass Effect */
    background: rgba(255, 255, 255, 0.15); 
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(10px);
    border-radius: 25px;
    overflow: hidden;
    border: 1px solid rgba(255, 255, 255, 0.3);
    box-shadow: 0 20px 50px rgba(0,0,0,0.15);
}

/* Header - Yellow-ku badhula Professional Navy */
th {
    background: yellow;
    color: black;
    padding: 18px;
    text-transform: uppercase;
    font-size: 17px;
    letter-spacing: 1.5px;
    border: none;
}

/* Data Rows */
td {
    padding: 15px;
    color: #1a1a1a; /* Dark text for readability */
    font-weight: 600;
    font-size: 16px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.2);
}

/* Row Hover Effect */
tr:hover {
    background: rgba(255, 255, 255, 0.2);
    transition: 0.3s;
}

@media print {
    /* 1. பேக்ரவுண்ட் இமேஜை முழுமையாக நீக்க */
    body::before, body {
        background: none !important;
        background-image: none !important;
        background-color: white !important;
    }

    /* 2. பட்டன்கள் மற்றும் தேவையற்றவற்றை மறைக்க */
    .btn-print, .back-link, .top-left, .top-right, .tool-row { 
        display: none !important; 
    }

    /* 3. கலர் மட்டும் வர இது முக்கியம் */
    * {
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
    }

    /* 4. ஹெடர் மற்றும் டேபிள் செட்டிங்ஸ் */
    .main-wrapper, .container {
        background: white !important;
        box-shadow: none !important;
        border: none !important;
        padding: 0 !important;
    }

    .master-header-box {
        border: 2px solid black !important;
        box-shadow: none !important;
        background: white !important;
        border-radius: 10px !important;
    }

    /* 5. தலைப்பு - இங்கே SHADE நீக்கப்பட்டுள்ளது */
    h1 {
        color: green !important;
        text-shadow: none !important; /* 👈 ஷேடோ வராது */
    }

    /* 6. டேபிள் பார்டர்கள் மற்றும் மஞ்சள் நிறம் */
    table {
        border-collapse: collapse !important;
        width: 100% !important;
    }

    th {
        background-color: yellow !important; /* 👈 பிரிண்டில் மஞ்சள் நிறம் தெரியும் */
        color: black !important;
        border: 1px solid black !important;
    }

    td {
        border: 1px solid black !important;
        color: black !important;
    }
}
    </style>
</head>
<body>

<div class="container">
    <div class="header-box">
    <a href="Brand Network.html" class="back-link">⬅ BACK</a>
    <button class="btn-print" onclick="window.print()">🖨️ PRINT</button>
    
    <!-- Unga Logo -->
    <img src="Logo.jpeg" width="120" style="margin-bottom: 10px;">
    
<h1 style="
    color: green; 
    margin: 0; 
    font-size: 32px; 
    text-transform: uppercase; 
    font-weight: bold;
    /* லேசான நிழல் மட்டும் (Soft Shadow) */
    text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2); 
    letter-spacing: 1px;">
    🗺️ ZONAL BRAND-ASSET DIRECTORY 
</h1>    
    <!-- Indha ID-la dhaan ooru peru update aagum -->
    <h2 id="regionTitle" style="color: orange; font-size: 30px; margin: 15px 0 0 0; background:  display: inline-block; padding: 8px 25px; border-radius: 50px;">
        📍 REGION: LOADING...
    </h2>
</div>

    <div id="tableArea">
        <h3 style="text-align:center; color:#7f8c8d;">Connecting to Cloud... ⚡</h3>
    </div>
<!-- Firebase Scripts -->

<script src="https://cdnjs.cloudflare.com/ajax/libs/dexie/4.2.0/dexie.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/9.6.10/firebase-app-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/9.6.10/firebase-database-compat.js"></script>

<script>
    // 1. Unga Firebase Config (Same as before)
    const firebaseConfig = { 
        apiKey: "AIzaSyBC9Ny5zLH2TBQK9r469OXAMeQ6AbiScn8", 
    databaseURL: "https://vimag-database-default-rtdb.firebaseio.com",
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const brandsList = ["Rhodius", "Laco", "Lessmann", "Capital Weld Cleaners", "Dedeco", "Einhell", "Peddinghaus", "Rexcut", "Shannon", "Starrett", "Voelkel"];

    window.onload = async function() {
        // 2. URL-la irundhu Region pera edukkurom
        const params = new URLSearchParams(window.location.search);
        const region = params.get('region');

        if (!region) {
            document.getElementById('tableArea').innerHTML = "<h2>No region selected!</h2>";
            return;
        }

    document.getElementById('regionTitle').innerText = "💎 REGION: " + region.toUpperCase();

        try {
            // 3. Firebase path: vimag/brands (Lowercase check)
            const snapshot = await db.ref('vimag/brands').once('value');
            const allData = snapshot.val() || {};
            let resultsMap = {}; 

            // 4. Cloud logic: Scan all 11 brands to find matches
            brandsList.forEach(brand => {
                if (allData[brand]) {
                    Object.keys(allData[brand]).forEach(custName => {
                        const lock = allData[brand][custName]["_id_lock"];
                        if (lock && lock.region && lock.region.trim().toUpperCase() === region.trim().toUpperCase()) {
                            if (!resultsMap[custName]) resultsMap[custName] = [];
                            resultsMap[custName].push(brand.toUpperCase());
                        }
                    });
                }
            });

            const sortedNames = Object.keys(resultsMap).sort();

            if (sortedNames.length === 0) {
                document.getElementById('tableArea').innerHTML = `<h3 style="color:red; text-align:center;">No records found for ${region}!</h3>`;
                return;
            }

            // 5. Build Final Table with Borders
            let html = `<table>
                <thead>
                    <tr>
                        <th>S.NO</th>
                        <th>🏢 COMPANY NAME</th>
                        <th>📦 ACTIVE BRANDS</th>
                    </tr>
                </thead>
                <tbody>`;

            sortedNames.forEach((name, idx) => {
                html += `<tr>
                    <td align="center">${(idx + 1).toString().padStart(2, '0')}</td>
                   <td>
    <a href="Sales Report.html?name=${encodeURIComponent(name)}" 
       style="text-decoration:none; color:#c0392b; font-weight:bold;">
       🏢 ${name}
    </a></td>
                    <td style="color:#2980b9;">📍 ${resultsMap[name].join(' | ')}</td>
                </tr>`;
            });

            document.getElementById('tableArea').innerHTML = html + "</tbody></table>";

        } catch (e) {
            console.error(e);
            document.getElementById('tableArea').innerHTML = "<h3 style='color:red;'>Sync Error! Check Internet Connection.</h3>";
        }
    };
</script>

</body>
</html>
